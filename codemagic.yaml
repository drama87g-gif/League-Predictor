workflows:
flutter-workflow:
name: Build Android & iOS

triggering:
  events:
    - push
    - pull_request
  branch_patterns:
    - pattern: main
      include: true
    - pattern: master
      include: true

environment:
  flutter: stable
  xcode: latest
  cocoapods: default

max_build_duration: 60

scripts:
  - name: Setup
    script: |
      set -e
      echo "Flutter version:"
      flutter --version

  - name: Install dependencies
    script: |
      flutter pub get

      if [ -d ios ]; then
        cd ios
        pod install --repo-update || true
        cd ..
      fi

  - name: Run tests
    script: |
      flutter test

  - name: Build Android (release)
    script: |
      flutter build apk --split-per-abi --release

  - name: Build iOS (no codesign)
    script: |
      flutter build ios --no-codesign --release

artifacts:
  - build/app/outputs/flutter-apk/*.apk
  - build/ios/iphoneos/Runner.app

cache_paths:
  - $FLUTTER_ROOT/.pub-cache
  - ~/.pub-cache
  - ~/.gradle/caches
```
