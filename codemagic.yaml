workflows:
  flutter-workflow:
    name: Build Android & iOS
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: "main"
        - pattern: "master"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      cache:
        cache_paths:
          - "$FLUTTER_ROOT/.pub-cache"
          - "~/.pub-cache"
          - "~/.gradle/caches"
    max_build_duration: 60
    scripts:
      - name: Setup
        script: |
          set -e
          echo "Flutter version:"
          flutter --version
      - name: Install dependencies
        script: |
          flutter pub get
          if [ -d ios ]; then
            cd ios
            pod install --repo-update || true
            cd ..
          fi
      - name: Run tests
        script: |
          flutter test
      - name: Build Android (release)
        script: |
          flutter build apk --split-per-abi --release
      - name: Build iOS (no codesign)
        script: |
          # Building iOS without codesign on Codemagic
          flutter build ios --no-codesign --release || true
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/ipa/*.ipa
